[package]
name = "smart-shell-complete"
version = "0.1.0"
edition = "2021"
description = "Shell autocomplete that learns from your history"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
